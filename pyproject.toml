[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pymacruise"
version = "0.1.6"
description = "Python-native MaCRUISE cortical segmentation and surface workflow"
readme = "readme.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "license_info.md",
    "licenses/upstream/*/*.txt",
    "licenses/upstream/*/*.html",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.23,<3",
    "numba>=0.61,<1",
    "nibabel>=5.2,<6",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
ants = ["antspyx>=0.6,<0.7", "numpy>=1.23,<2.3", "scipy>=1.10,<1.15"]
dev = ["pytest>=8,<9", "build>=1.2,<2", "setuptools>=77.0.3", "wheel", "scikit-image>=0.22,<1"]

[project.scripts]
pymacruise = "pymacruise.cli:main"
pymacruise-lesion-output = "pymacruise.lesion_output_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymacruise = ["data/*.raw.gz", "data/*.json", "data/SHA256SUMS"]
